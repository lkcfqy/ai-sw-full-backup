<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <title>KitGuard — 키팅 검증 워크스페이스</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/study.css">
  <link rel="stylesheet" href="/static/region.css">
  <link rel="stylesheet" href="/static/workflow.css">
  <link rel="stylesheet" href="/static/public-review.css?v=0.8.0.feedback1">
  <link rel="stylesheet" href="/static/digital-resolution.css?v=0.9.0">
  <script src="/static/spatial.js" defer></script>
  <script src="/static/audit.js?v=0.8.0.dev2" defer></script>
  <script src="/static/camera.js" defer></script>
  <script src="/static/region.js" defer></script>
  <script src="/static/app.js?v=0.8.0.feedback1" defer></script>
  <script src="/static/photo-documents.js?v=0.8.0.dev2" defer></script>
  <script src="/static/workflow.js" defer></script>
  <script src="/static/public-review.js?v=0.8.0.feedback1" defer></script>
  <script src="/static/digital-resolution.js?v=0.9.0" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">본문으로 건너뛰기</a>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="region-dialog" class="modal kg-region-modal" aria-labelledby="region-title"></dialog>
  <dialog id="photo-document-dialog" class="modal modal-wide"></dialog>
  <dialog id="order-dialog" class="modal"></dialog>
  <dialog id="revision-dialog" class="modal modal-wide"></dialog>
  <dialog id="references-dialog" class="modal modal-wide"></dialog>
  <dialog id="camera-dialog" class="modal modal-wide"></dialog>
  <dialog id="complete-dialog" class="modal"></dialog>
  <dialog id="model-dialog" class="modal"></dialog>
  <dialog id="workflow-dialog" class="modal"></dialog>
  <dialog id="digital-resolution-dialog" class="modal resolution-modal"></dialog>
  <dialog id="audit-dialog" class="modal audit-modal" aria-labelledby="audit-dialog-title"></dialog>
  <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="capture-file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
  <input id="reference-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
</body>
</html>
