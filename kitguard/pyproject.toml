[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kitguard"
version = "0.9.0.dev4"
description = "Local evidence-driven kitting assistant"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pillow>=11,<13", "pydantic>=2.10,<3"]

[project.optional-dependencies]
detector = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]
local = ["mlx-vlm>=0.7.3,<0.8", "huggingface-hub>=0.34", "safetensors>=0.6", "torch>=2.8,<3", "torchvision>=0.23,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12"]

[tool.setuptools]
packages = ["kitguard"]
include-package-data = false

[tool.setuptools.package-data]
kitguard = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# Preserve the exact preparation source bound by the v0.8 FOD/training receipts
# (SHA256 06f350bc42bb4f1d11a3ca1df954c7f899b8dfcafe1f94f2082c23e3744aa875).
# Only import ordering is exempt; all functional checks remain enabled.
"scripts/v08/prepare_foda_grouped_development.py" = ["I001"]
